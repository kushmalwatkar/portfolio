{% load static %} <!-- This must be at the top! -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{% static 'Portfolio/css/styles.css' %}">
    {% block css %}
    {% endblock %}

    <!-- Title with Fallback -->
    <title>{% block title %}Kush Malwatkar - Robotics @ WPI{% endblock %}</title>

    <!-- Standard Meta Description for Google Search -->
    <meta name="description" content="Robotics Engineering Student @ WPI | Embedded Systems & Automation | Projects: Autonomous Systems, Hardware Integration, Microcontrollers.">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="{% static 'Portfolio/css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'fonts/Satoshi_Complete/Fonts/WEB/css/satoshi.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- Favicons -->
    <link rel="icon" href="{% static 'Portfolio/images/logos/logo2.ico' %}" sizes="any">
    <link rel="icon" href="{% static 'Portfolio/images/logos/logo 2.png' %}" type="image/png">
    <link rel="apple-touch-icon" href="{% static 'Portfolio/images/logos/logo 2.png' %}">

    <!-- Open Graph for Social Sharing (LinkedIn, iMessage, Discord previews) -->
    <meta property="og:title" content="Kush Malwatkar - Robotics Engineering Student @ WPI"/>
    <meta property="og:description" content="Robotics Engineering Student @ WPI | Embedded Systems & Automation | Projects: Autonomous Systems, Hardware Integration, Microcontrollers."/>
    <meta property="og:image" content="https://www.kushmalwatkar.com{% static 'Portfolio/images/logos/logo 2.png' %}"/>
    <meta property="og:url" content="https://www.kushmalwatkar.com"/>
    <meta property="og:type" content="website"/>

    <!-- Google Site Verification -->
    <meta name="google-site-verification" content="n9mpGQljeR1kixyHa1UZpUVeg4Swku4uJliueb0GvRQ" />

    <!-- Structured Data (Schema.org) for Search Engines -->
    <script type="application/ld+json">
    [
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Kush Malwatkar",
        "alternateName": ["Kush Malwatkar Portfolio", "Kush Malwatkar Website"],
        "url": "https://www.kushmalwatkar.com/"
      },
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Kush Malwatkar",
        "url": "https://www.kushmalwatkar.com",
        "jobTitle": "Robotics Engineering Student",
        "worksFor": {
          "@type": "CollegeOrUniversity",
          "name": "Worcester Polytechnic Institute"
        },
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "Worcester Polytechnic Institute"
        },
        "sameAs": [
          "https://github.com/kushmalwatkar",
          "https://www.linkedin.com/in/kush-malwatkar/"
        ]
      }
    ]
    </script>
</head>
<body>
    <div class="nav">
        <div class="nav-cont">
            <div class="nav-main">
                <a class="logo" href="/"><img src="{% static 'Portfolio/images/logos/logo4.png' %}" alt=""></a>
                <a class="nav-btn" href="/">Home</a>
                <a class="nav-btn" href="/about">About</a>
                <a class="nav-btn" href="/projects">Projects</a>
                <a class="nav-btn" href="/resume">Resume</a>
                <a class="nav-btn" href="/contact">Contact</a>
            </div>
        </div>
    </div>
    <div class="cont">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
