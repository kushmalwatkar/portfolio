{% load static %} <!-- This must be at the top! -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'Portfolio/css/styles.css' %}">
    {% block css %}
    {% endblock %}

    <!-- Standard Title & Description for Google Search -->
    <title>{% block title %}{% endblock %}</title>
    <meta name="description" content="WPI student passionate about embedded systems, robotics, and automation.">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="{% static 'Portfolio/css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'fonts/Satoshi_Complete/Fonts/WEB/css/satoshi.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- Favicons -->
    <!-- Recommended: Standard favicon.ico file -->
    <link rel="icon" href="{% static 'Portfolio/images/logos/logo2.ico' %}" sizes="any">
    <!-- PNG Favicon Backup -->
    <link rel="icon" href="{% static 'Portfolio/images/logos/logo 2.png' %}" type="image/png">
    <!-- Apple Touch Icon (recommended 180x180 PNG) -->
    <link rel="apple-touch-icon" href="{% static 'Portfolio/images/logos/logo 2.png' %}">

    <!-- Open Graph for Social Sharing (LinkedIn, iMessage, Discord previews) -->
    <meta property="og:title" content="Kush Malwatkar"/>
    <meta property="og:description" content="[FILL IN: Short description for social media previews]"/>
    <!-- Must be a full absolute URL pointing to a thumbnail image (1200x630px recommended) -->
    <meta property="og:image" content="https://www.kushmalwatkar.com{% static '[FILL IN: path/to/preview-image.jpg]' %}"/>
    <meta property="og:url" content="https://www.kushmalwatkar.com"/>
    <meta property="og:type" content="website"/>

    <!-- Google Verification -->
    <meta name="google-site-verification" content="n9mpGQljeR1kixyHa1UZpUVeg4Swku4uJliueb0GvRQ" />

    <!-- Vercel Web Analytics -->
    <script defer src="https://cdn.vercel-insights.com/v1/script.debug.js"></script>

    <!-- Structured Data (Schema.org) for search engine entity recognition -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Kush Malwatkar",
      "url": "https://www.kushmalwatkar.com",
      "jobTitle": "[FILL IN: e.g., Robotics Engineer / Student]",
      "alumniOf": "Worcester Polytechnic Institute",
      "sameAs": [
        "https://github.com/[FILL IN: your-github-username]",
        "https://linkedin.com/in/[FILL IN: your-linkedin-username]"
      ]
    }
    </script>
</head>
<body>
    <div class="nav">
        <div class="nav-cont">
            <div class="nav-main">
                <a class="logo" href="/"><img src="{% static 'Portfolio/images/logos/logo4.png' %}" alt=""></a>
                <a class="nav-btn" href="/">Home</a>
                <a class="nav-btn" href="/about">About</a>
                <a class="nav-btn" href="/projects">Projects</a>
                <a class="nav-btn" href="/resume">Resume</a>
                <a class="nav-btn" href="/contact">Contact</a>
            </div>
        </div>
    </div>
    <div class="cont">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
